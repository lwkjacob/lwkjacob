<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="14" viewBox="0 0 1000 14">
  <style>
    .s { animation: s 2.8s linear infinite; }
    @keyframes s { from { transform: translateX(-200px) } to { transform: translateX(1000px) } }
  </style>
  <defs>
    <linearGradient id="l" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".45"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="b" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect y="6" width="1000" height="2" fill="url(#l)"/>
  <rect class="s" y="5" width="200" height="4" rx="2" fill="url(#b)"/>
</svg>
